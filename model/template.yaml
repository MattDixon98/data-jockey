AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: data-jockey model training, fitting the win-odds weights monthly from the clean tables

# Uses the clean bucket and data_jockey database from the data-jockey-glue
# stack (deploy that first). Everything this stack writes goes under the
# clean bucket's model/ prefix (weights, reports) and code/ (the wheel).

Resources:
  # Role name is generated from the stack name (data-jockey-model-...), which
  # keeps it inside the deployer policy's data-jockey-* scope.
  TrainJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Catalog access (Athena reads the table definitions through Glue), CloudWatch logs.
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: training-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: QueryWithAthena
                Effect: Allow
                Action: [athena:StartQueryExecution, athena:GetQueryExecution, athena:GetQueryResults]
                Resource: !Sub arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/primary
              - Sid: ReadWriteCleanBucket
                # Table data (read), Athena results under tmp/, model/ outputs, code/ wheel.
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !Sub arn:aws:s3:::data-jockey-clean-${AWS::AccountId}
                  - !Sub arn:aws:s3:::data-jockey-clean-${AWS::AccountId}/*
              - Sid: WithdrawBlend
                # A blend that stops beating the market is removed (data_jockey_model/run.py).
                Effect: Allow
                Action: s3:DeleteObject
                Resource: !Sub arn:aws:s3:::data-jockey-clean-${AWS::AccountId}/model/blend.json
              - Sid: ReadJobScript
                # `sam deploy` uploads the job script to its managed bucket.
                Effect: Allow
                Action: s3:GetObject
                Resource: arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/data-jockey-model/*

  TrainModelJob:
    Type: AWS::Glue::Job
    Properties:
      Name: data-jockey-train-model
      Description: Fits the win-odds weights from runner_features; promotes them if they beat the current model
      Role: !GetAtt TrainJobRole.Arn
      # Python shell: a single small machine, no Spark. The fit takes seconds.
      MaxCapacity: 0.0625
      Timeout: 30
      MaxRetries: 0
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        # Local path: `sam deploy` uploads it to S3 and rewrites this.
        ScriptLocation: jobs/train.py
      DefaultArguments:
        # numpy, scipy, pandas preinstalled.
        library-set: analytics
        # The data_jockey_model package; built and uploaded by scripts/deploy.sh.
        --extra-py-files: !Sub s3://data-jockey-clean-${AWS::AccountId}/code/data_jockey_model-0.1.0-py3-none-any.whl
        --bucket: !Sub data-jockey-clean-${AWS::AccountId}
        --database: data_jockey
        --athena_output: !Sub s3://data-jockey-clean-${AWS::AccountId}/tmp/athena/
        --model_prefix: model/

  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-job
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: glue:StartJobRun
                Resource: !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:job/${TrainModelJob}

  # Monthly, on the 1st at 05:30: before the 07:00 rebuild, which loads the
  # models at its start, so a new model is on the site that morning (training
  # reads the tables the previous day's rebuild wrote). The weights change slowly
  # (a month adds ~1,500 races); the features the rebuild scores with update
  # every day regardless.
  MonthlyTrainSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: data-jockey-train-model-monthly
      Description: Retrain the win-odds model on the 1st of each month
      ScheduleExpression: cron(30 5 1 * ? *)
      ScheduleExpressionTimezone: Europe/London
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:glue:startJobRun
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: !Sub '{"JobName": "${TrainModelJob}"}'
        RetryPolicy:
          MaximumRetryAttempts: 0

  # Weekly too while the history is short (each week adds ~7% more races, and
  # the blend is adopted the week it qualifies), until EndDate: then only the
  # monthly schedule above runs, with no change needed. Sundays 05:00, before
  # the 07:00 rebuild like the monthly run, and half an hour ahead of it when the
  # 1st is a Sunday, so they never overlap (one job run at a time). Each promoted
  # model adds a scoring branch to the rebuild's model_odds, so weekly for good
  # would mean ~52 a year.
  WeeklyTrainSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: data-jockey-train-model-weekly
      Description: Retrain the win-odds model every Sunday until April 2027
      ScheduleExpression: cron(0 5 ? * SUN *)
      ScheduleExpressionTimezone: Europe/London
      EndDate: "2027-04-01T00:00:00.000Z"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:glue:startJobRun
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: !Sub '{"JobName": "${TrainModelJob}"}'
        RetryPolicy:
          MaximumRetryAttempts: 0

Outputs:
  JobName:
    Description: Glue job name (use with `aws glue start-job-run`)
    Value: !Ref TrainModelJob
  ModelLocation:
    Description: Where the weights and reports go
    Value: !Sub s3://data-jockey-clean-${AWS::AccountId}/model/
