<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        margin: 0;
        padding: 2rem;
      }
      .container {
        max-width: 700px;
        margin: 0 auto;
        background: #111827;
        border-radius: 12px;
        padding: 2rem;
      }
      h1 {
        margin-top: 0;
      }
      .tag {
        display: inline-block;
        background: #2563eb;
        color: white;
        padding: 0.4rem 0.8rem;
        border-radius: 999px;
        font-size: 0.8rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="tag">Django starter</div>
      <h1>{{ title }}</h1>
      <p>This is a basic Django app scaffold for your project.</p>
      <p>Use this as the website foundation while you build out the real product pages and data workflows.</p>
    </div>
  </body>
</html>
